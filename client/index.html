        --- PUBLIC PAGES (no navbar/footer) ---

        LANDING PAGE (/)
        <main class="landing" role="main">
          <section class="landing__hero">
            <img src="/images/hero-bg.webp" alt="SOAS Sapthagiri NPS University" />
            <h1>SOAS Feedback Collector</h1>
            <p>Anonymous course feedback platform for MCA students</p>
            <div class="landing__actions">
              <a href="/login" class="btn-landing">Get Started</a>
              <a href="/feedback/public" class="btn-landing btn-landing--secondary">Anonymous Feedback</a>
            </div>
          </section>
          <section class="landing__features">
            <h2>What features does SOAS Feedback Collector offer?</h2>
            <p>SOAS Feedback Collector provides a dual-channel feedback model with JWT-authenticated submissions and a fully anonymous public channel. Administrators can open or close feedback windows, track per-subject coverage, and export reports in CSV or Word format, all without exposing individual student identity.</p>
            <ul>
              <li>JWT-authenticated feedback with session-gated allotments</li>
              <li>Public anonymous feedback (no login, rate-limited)</li>
              <li>Admin dashboard with class management and drill-down</li>
              <li>Per-subject coverage tracking (gave / not-given lists)</li>
              <li>CSV and Word report exports via Blob URL generation</li>
            </ul>
          </section>
          <section class="landing__technical">
            <h2>What is the technical architecture of this feedback system?</h2>
            <p>This is a full-stack MERN application: React 19 with Vite 8 on the frontend, Express 4.21 on Node.js on the backend, and MongoDB 8 with Mongoose 8 for persistence. Authentication uses JWT with 30-day access tokens and 7-day refresh tokens. The server runs in PM2 cluster mode with Helmet security headers and gzip compression.</p>
            <table>
              <caption>Technology Stack</caption>
              <thead><tr><th>Layer</th><th>Technology</th><th>Version</th></tr></thead>
              <tbody>
                <tr><td>Frontend</td><td>React / Vite</td><td>React 19, Vite 8</td></tr>
                <tr><td>Backend</td><td>Node.js / Express</td><td>Express 4.21</td></tr>
                <tr><td>Database</td><td>MongoDB / Mongoose</td><td>MongoDB 8, Mongoose 8</td></tr>
                <tr><td>Auth</td><td>JWT / bcryptjs</td><td>jsonwebtoken 9, bcryptjs 2</td></tr>
                <tr><td>Process</td><td>PM2 Cluster</td><td>PM2 7, auto-restart</td></tr>
              </tbody>
            </table>
          </section>
          <section class="landing__coverage">
            <h2>How does feedback coverage tracking work?</h2>
            <p>Administrators can view per-subject coverage for any class group. The system identifies all students in a class, cross-references them against feedback submissions for a given subject, and returns two lists: students who gave feedback and students who have not. Coverage percentages are calculated and displayed in real time.</p>
          </section>
        </main>

        LOGIN PAGE (/login)
        <main class="login" role="main">
          <h1>Login to SOAS Feedback Collector</h1>
          <form>Email + USN + Password fields</form>
          <p>Developed by Pawan Simha R, MCA, SOAS, Sapthagiri NPS University</p>
        </main>

        PUBLIC FEEDBACK (/feedback/public)
        <main class="public-feedback" role="main">
          <h1>Submit Anonymous Feedback</h1>
          <p>No login required. Your identity is not collected.</p>
          <form>Subject dropdown + Faculty name + Comments (100-300 chars)</form>
        </main>

        --- AUTHENTICATED PAGES (with navbar + footer) ---

        <main class="container" id="main-content">

          <section>Active session status</section>
          <section>Start feedback button</section>
        </main>

        FEEDBACK FORM (/feedback)
        <main class="container" id="main-content">
          <h1>Sequential Feedback Form</h1>
          <nav>Step indicators for 6 subjects</nav>
          <section class="sf-card">
            <h2>Current Subject Name</h2>
            <textarea>Feedback comments (50-300 chars)</textarea>
            <div>Previous / Lock / Next buttons</div>
          </section>
        </main>

        MY FEEDBACK (/my-feedback)
        <main class="container" id="main-content">

            <thead><tr><th>Subject</th><th>Comments</th><th>Date</th></tr></thead>
            <tbody><tr><td>-</td><td>-</td><td>-</td></tr></tbody>
          </table>
        </main>

        ADMIN PAGES (/admin/*)
        [All admin routes require JWT with admin role]
        /admin         -> Class selection grid
        /admin/database-> Database Overview (5 tabs: Dashboard, Students, Feedbacks, Allotments, Anonymous)
        /admin/allotments -> Open/close feedback windows per class
        /admin/anonymous -> Search anonymous submissions
        /admin/:classGroup -> Per-class student grid
        /admin/:classGroup/dashboard -> Per-class feedback dashboard with subject filter
        /admin/:classGroup/student/:studentId -> Individual student feedback view
